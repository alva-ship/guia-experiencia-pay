.hero h1,.sec h2,.about h2,.body h3,.brand,.gest-text{font-family:var(--font-title)}
/* Layout v4: header violeta fijo de 64px, contenido centrado a 1200px + menú lateral colapsable + hero negro + intro grande + índice en dos columnas + secciones 1/3 título, 2/3 cuerpo.
   Modo claro deliberado (plan v2). Marca provisoria: cambiar solo estos tokens. */
:root{
  color-scheme: light;
  /* Colores de las presentaciones de Personal Pay (Figma, sección 30/10) */
  --header:#5D51FF; --hero:#5D51FF; --bg:#F9FAFE; --surface:#FFFFFF;
  --text:#171717; --text-2:#404040; --text-3:#676767; --on-dark:#FFFFFF; --on-dark-95:rgba(255,255,255,.95);
  --line:#EDEDF1; --line-strong:#E4E5ED; --line-table:#DCDEE8; --ph:#EDEDF1; --ph-text:#404040;
  --accent:#5A50F9; --accent-dark:#4338CA; --accent-soft:#EEF2FF; --accent-border:#C7D2FE;
  --do:#15803D; --do-soft:#F0FDF4; --dont:#B91C1C; --dont-soft:#FFE1E3;
  --radius:16px; --pill:999px;
  --font:"Red Hat Text","Helvetica Neue",Arial,sans-serif;
  --font-title:"Pulso","Red Hat Text","Helvetica Neue",Arial,sans-serif;
  --header-h:64px; --wrap:1200px; --gutter:64px; --side-w:256px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:26px;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--header)}
a{color:var(--accent);text-underline-offset:3px}
a:hover{color:var(--accent-dark)}
p,h1,h2,h3,ul,ol,dl,dd{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font-family:inherit}

/* Header */
.header{border-bottom:1px solid rgba(255,255,255,.2);position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;height:var(--header-h);background:var(--header);color:var(--on-dark);display:flex;align-items:center;z-index:50;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
.brand{color:var(--on-dark);text-decoration:none;font-size:18px;line-height:24px;padding:0 16px 0 24px;white-space:nowrap}
.brand:hover{color:var(--on-dark)}
.brand b{font-weight:700}
.brand{display:inline-flex;align-items:center;gap:8px}
.brand-logo{height:1em;width:1em;flex:none;display:block}
.header .spacer{flex:1}
.icon-btn{width:48px;height:48px;border:0;background:transparent;color:var(--on-dark);display:grid;place-items:center;cursor:pointer}
.icon-btn:hover{background:rgba(255,255,255,.12)}
.search-pill{display:flex;align-items:center;gap:8px;height:40px;margin-right:16px;padding:0 16px 0 14px;border:0;border-radius:var(--pill);background:rgba(255,255,255,.16);color:var(--on-dark);font-size:15px;cursor:pointer}
.search-pill:hover{background:rgba(255,255,255,.26)}
.search-pill svg{width:18px;height:18px}
.icon-btn svg{width:20px;height:20px}
#menuBtn{display:none}

/* Sidebar */
.side{position:fixed;top:calc(var(--header-h) + env(safe-area-inset-top,0px));bottom:0;left:0;width:calc(var(--side-w) + env(safe-area-inset-left,0px));padding-left:env(safe-area-inset-left,0px);background:var(--surface);border-right:1px solid var(--line);overflow-y:auto;padding-block:16px 32px;z-index:40}
.nav-link,.nav-group{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:40px;padding:8px 16px 8px 20px;border:0;background:transparent;color:var(--text);font-size:15px;line-height:20px;font-weight:500;text-decoration:none;text-align:left;cursor:pointer}
.nav-link:hover,.nav-group:hover{background:var(--bg)}
.nav-group svg{width:16px;height:16px;flex:none;transition:transform .15s}
.nav-group[aria-expanded="true"] svg{transform:rotate(180deg)}
.nav-items[hidden],.nav-secs[hidden]{display:none}
.chapter{scroll-margin-top:var(--header-h)}
.hero.hero-ch{min-height:200px;padding-top:40px;padding-bottom:40px}
#side .nav-link.in-ch{color:var(--accent);font-weight:600}
.nav-secs .nav-link.anchor{padding-left:44px}
.nav-link.sub{font-weight:400;padding-left:36px;color:var(--text-2);font-size:15px}
.nav-link.anchor{font-weight:400;padding-left:36px;color:var(--text-2);font-size:14px;min-height:36px}
.nav-link[aria-current]{background:var(--accent-soft);color:var(--accent);font-weight:600;box-shadow:inset 3px 0 0 var(--accent)}
.nav-divider{height:1px;background:var(--line);margin:12px 20px}

/* Main */
main{margin-left:var(--side-w);padding-top:var(--header-h);min-width:0}
.hero{background:var(--hero);color:var(--on-dark);min-height:240px;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;gap:32px;padding:48px max(var(--gutter),calc((100% - var(--wrap)) / 2),env(safe-area-inset-right,0px)) 48px max(var(--gutter),calc((100% - var(--wrap)) / 2))}
.hero h1{font-weight:700;font-size:76px;line-height:84px;letter-spacing:-0.02em;max-width:16ch;text-wrap:balance;color:var(--on-dark-95)}
.content{padding:64px max(var(--gutter),calc((100% - var(--wrap)) / 2),env(safe-area-inset-right,0px)) 96px max(var(--gutter),calc((100% - var(--wrap)) / 2));display:flex;flex-direction:column;gap:48px}
.intro{font-size:26px;line-height:38px;font-weight:400;max-width:900px;color:var(--text)}

.sec{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:32px;border-top:1px solid var(--line-strong);padding-top:32px;scroll-margin-top:calc(var(--header-h) + 16px)}
.sec-head{display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.sec-head .num{font-size:13px;line-height:18px;font-weight:500;color:var(--accent);background:var(--accent-soft);padding:2px 10px;border-radius:var(--pill)}
.sec h2{font-weight:300;font-size:32px;line-height:40px;letter-spacing:-0.02em;text-wrap:balance}
/* Principios: cabecera fuerte y fija */
.sec.p{padding-top:0;gap:32px}
.sec.p > .body{padding-top:64px}
.sec.p .sec-head{position:sticky;top:calc(var(--header-h) - 30px);align-self:start;border-top:2px solid var(--accent);margin-top:-1px;padding-top:62px;gap:16px}

.about{max-width:900px;display:flex;flex-direction:column;gap:12px;margin-top:-16px}
.about h2{font-size:20px;line-height:28px;font-weight:700;color:var(--text)}
.sec.p h2{font-weight:400;font-size:40px;line-height:48px}
.gest{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.gest-label{font-size:12px;line-height:16px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.gest-text{font-size:18px;line-height:26px;color:var(--text-2)}
.body{display:flex;flex-direction:column;gap:16px;min-width:0;max-width:720px}
.body h3{font-size:20px;line-height:28px;font-weight:700;margin-top:16px}
.body h3:first-child{margin-top:0}
.body h4{font-size:16px;line-height:26px;font-weight:600;margin:0}
.body strong,.body b{font-weight:600}
.lead-b{font-size:24px;line-height:34px;font-weight:400;letter-spacing:-0.01em;color:var(--text)}
ul.dash{list-style:none;padding:0;display:flex;flex-direction:column;gap:8px}
ul.dash li{position:relative;padding-left:24px}
ul.dash li::before{content:"–";position:absolute;left:0;color:var(--text-2)}
.tag{display:inline-block;font-size:12px;line-height:18px;font-weight:500;color:var(--text-3);border:1px solid var(--accent-border);border-radius:var(--pill);padding:1px 10px;vertical-align:middle;margin-left:10px}
.h-row{display:flex;align-items:center;flex-wrap:wrap;gap:0}
.note{background:transparent;border:1px solid var(--line-table);border-radius:var(--radius);padding:16px 20px;font-size:15px;line-height:24px;display:flex;flex-direction:column;gap:4px}
.note b{font-weight:600}
.small{font-size:14px;line-height:20px;color:var(--text-2)}
.more{font-size:15px;font-weight:500;text-decoration:none}
.more:hover{text-decoration:underline}

/* Tablas */
.table-wrap{overflow-x:auto;background:transparent;border-top:1px solid var(--line-table)}
table{border-collapse:collapse;width:100%;font-size:15px;line-height:22px}
th{text-align:left;font-weight:600;background:transparent;padding:12px 16px 12px 0;vertical-align:top;border-bottom:1px solid var(--text-3)}
td{padding:14px 16px 14px 0;border-bottom:1px solid var(--line-table);vertical-align:top}
td:first-child{font-weight:600}
td.plain{font-weight:400}

/* Bloques para cargar */
.ph{background:var(--ph);border-radius:var(--radius);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;padding:16px;width:100%;max-width:100%}
.ph b{font-weight:400;font-size:14px;line-height:20px;color:var(--ph-text)}
.ph span{font-size:12px;line-height:16px;color:var(--text-3)}
.ph.wide{aspect-ratio:16/9}
.ph.square{aspect-ratio:1/1}
.ph.phone{aspect-ratio:9/16;max-width:240px}
.ph-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.page-ph{max-width:960px}
.intro p{margin:0}
.intro p+p{margin-top:24px}
.cover{display:block;width:100%;height:auto;border-radius:var(--radius)}

/* Hacé / Evitá */
.dodont{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
.dd{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;min-width:0;background:transparent;border:1px solid var(--line-table);border-radius:var(--radius);padding:16px}
.dd-label{align-self:center;font-weight:600;font-size:14px;line-height:20px;padding:2px 12px;border-radius:var(--pill)}
.dd.do .dd-label{background:var(--do-soft);color:var(--do)}
.dd.dont .dd-label{background:var(--dont-soft);color:var(--dont)}
.dd .ph.phone{max-width:240px}

/* Ejemplos de mensajes */
.example{display:grid;grid-template-columns:minmax(0,1fr) 160px;gap:24px;padding-top:16px;border-top:1px solid var(--line)}
.example:first-of-type{border-top:0;padding-top:0}
.example .left{display:flex;flex-direction:column;gap:12px;min-width:0}
.msg{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:4px;max-width:360px}
.msg .t{font-weight:600}
.msg .c{margin-top:8px;align-self:flex-start;font-size:14px;font-weight:500;color:var(--accent);border:1px solid var(--accent);border-radius:var(--pill);padding:4px 14px}
.example .ph.phone{max-width:160px}

/* Checklist */
.seg{display:flex;flex-wrap:wrap;gap:0;border:1px solid var(--text-3);border-radius:var(--pill);overflow:hidden;align-self:flex-start;max-width:100%}
.seg button{border:0;background:var(--surface);color:var(--text);font-size:15px;padding:8px 16px;cursor:pointer;border-right:1px solid var(--text-3)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--header);color:var(--on-dark)}
.checks{list-style:none;padding:0;display:flex;flex-direction:column;gap:10px}
.checks label{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.checks input{width:18px;height:18px;margin:4px 0 0;flex:none;accent-color:var(--accent)}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:16px}
.btn{font-size:15px;padding:8px 16px;border-radius:var(--pill);border:1px solid var(--text);background:transparent;color:var(--text);cursor:pointer}
.btn:hover{background:var(--surface)}

/* Glosario */
.filter{font-family:inherit;font-size:16px;padding:10px 12px;border-radius:8px 8px 0 0;border:0;border-bottom:1px solid var(--text-3);background:var(--surface);color:var(--text);width:100%;max-width:420px}

/* Pie */

/* Buscador */
.search{position:fixed;top:calc(var(--header-h) + env(safe-area-inset-top,0px));right:max(0px,env(safe-area-inset-right,0px));width:min(480px,100%);max-height:calc(100% - var(--header-h));overflow-y:auto;background:var(--surface);box-shadow:0 4px 16px rgba(0,0,0,.18);border-radius:0 0 0 var(--radius);z-index:55;padding:16px;display:flex;flex-direction:column;gap:8px}
.search input{font-family:inherit;font-size:16px;padding:10px 12px;border:0;border-bottom:1px solid var(--text-3);background:var(--bg);color:var(--text);width:100%}
.results{list-style:none;padding:0;display:flex;flex-direction:column}
.results a{display:block;padding:10px 8px;text-decoration:none;color:var(--text);border-bottom:1px solid var(--line)}
.results a:hover,.results a:focus-visible{background:var(--bg)}
.results small{display:block;color:var(--text-2);font-size:13px;line-height:18px}
.scrim{position:fixed;inset:0;background:rgba(22,22,22,.5);z-index:35}

@media (max-width:1055px){
  #menuBtn{display:grid}
  .brand{padding-left:4px}
  .side{transform:translateX(-102%);transition:transform .2s;width:min(300px,86vw);z-index:45;box-shadow:none}
  body.nav-open .side{transform:none;box-shadow:0 0 24px rgba(0,0,0,.25)}
  :root{--header-h:56px}
  main{margin-left:0}
  .search-pill{margin-right:8px}
  .hero{min-height:160px;padding:32px max(16px,env(safe-area-inset-right,0px)) 32px max(16px,env(safe-area-inset-left,0px))}
  .hero.hero-ch{min-height:132px;padding-top:28px;padding-bottom:28px}
  .hero h1{font-size:44px;line-height:52px}
  .content{padding:40px max(16px,env(safe-area-inset-right,0px)) 72px max(16px,env(safe-area-inset-left,0px));gap:40px}
  .intro{font-size:22px;line-height:32px}
  .sec{grid-template-columns:minmax(0,1fr);gap:16px}
  .sec h2{font-size:28px;line-height:36px}
  .sec.p .sec-head{position:static;padding-top:38px;gap:12px}
  .sec.p > .body{padding-top:0}
  .lead-b{font-size:20px;line-height:30px}
  .sec.p h2{font-size:32px;line-height:40px}
  .hero{gap:24px}
  .body h3{font-size:18px;line-height:26px}
}
@media (max-width:639px){
  .search-pill span{display:none}
  .brand{font-size:14px;padding-right:8px}
  .search-pill{padding:0 11px;width:40px;justify-content:center}

  .dodont{grid-template-columns:minmax(0,1fr)}
  .example{grid-template-columns:minmax(0,1fr)}
  .ph-row{grid-template-columns:minmax(0,1fr)}
  .ph-row .ph{max-width:320px}
}

 {id:"voz-y-tono", nav:"Voz y tono", group:"Lenguaje", hero:"Voz y tono",

 {id:"escribir", nav:"Cómo escribir un mensaje", group:"Lenguaje", hero:"Cómo escribir un mensaje",
  intro:"Ordenamos la información para que la persona pueda comprender y actuar.",
  sections:[
   ["partes-mensaje","Partes del mensaje", `
    <p class="lead-b">Usamos las partes que la situación necesita.</p>
    ${table(["Parte","Qué debe resolver"],[["Título","Presenta la propuesta o el estado principal. En errores y esperas, permite entender qué sucede."],["Texto de apoyo","Completa la información necesaria: valor, condiciones, consecuencias o próximos pasos."],["Acción","Anticipa qué va a pasar al tocar el botón o enlace."],["Ayuda contextual","Aclara una duda donde aparece, vinculada con la tarea."]])}
    <p>Una confirmación breve puede resolverse sin texto de apoyo ni botón.</p>`, "6.3"],
   ["reglas","Reglas de escritura", `
    <p class="lead-b">Nueve reglas para todos los mensajes.</p>
    ${dash([
     "<b>Hablamos de vos y usamos voz activa.</b> Pay dice “Te avisamos” o “Guardamos tus cambios”. Las acciones de la persona se expresan como “Elegiste” o “Configuraste”.",

     "<b>Describimos hábitos sin juzgar.</b> Nos apoyamos en hechos y objetivos elegidos: “Estás cerca del límite que configuraste”. Evitamos calificar el comportamiento de la persona.",
     "<b>El texto se entiende por sí mismo.</b> La información esencial no depende exclusivamente de imágenes, colores o emojis.",
     "<b>Cuidamos las convenciones.</b> Títulos sin punto final; textos de apoyo con puntuación completa. En cifras, punto para miles y coma para decimales: $1.250,50. Usamos dos decimales cuando existen y los omitimos en montos enteros: $1.250. El símbolo monetario va junto al monto. Las fechas llevan día/mes/año de dos cifras, sin ceros iniciales: 5/3/26. Estas convenciones siguen los Lineamientos y tono de marca.",
     "<b>Usamos emojis con moderación.</b> Al final de la oración y sin reemplazar palabras. Preferimos uno por oración, con un máximo de dos."])}`],
   ["re-humor","RE, expresiones, humor y metáforas", `
    <p class="lead-b">Elegimos estos recursos por lo que aportan al momento; no hace falta incluirlos en cada mensaje.</p>
    <h3>RE</h3>
    <p>En documentos de trabajo, <b>RE</b> nombra el territorio creativo. En los copies, <b>re</b> intensifica una cualidad, intención o valoración: “re útil”, “re pensado para vos”, “Re bien, llegaste a tu meta”. Lo escribimos separado de la expresión, como convención editorial de marca.</p>
    <p><b>No usamos “re” para nombrar productos, funcionalidades, programas o beneficios.</b> Sus nombres mantienen su denominación propia. El recurso aparece dentro de una frase cuando aporta énfasis y tiene sentido en el contexto.</p>
    <p>Ese énfasis debe estar respaldado por la experiencia: “re pensado para vos” requiere una adaptación reconocible; “re útil” debe acompañar una utilidad concreta.</p>
    <p>Podemos expresar el territorio y el gesto sin escribir “re”.</p>
    <h3>Expresiones cotidianas</h3>
    <p>Elegimos las expresiones cotidianas por <b>el gesto que realizan en la conversación</b>: recibir, preparar algo, reconocer, ayudar o tener una atención.</p>
    ${table(["Intención del gesto","Cómo puede expresarse","Qué debe sostenerla"],[["Recibir","“Qué bueno tenerte por acá”","Una bienvenida que facilite el comienzo."],["Tener algo preparado","“Te dejamos todo listo para seguir”","Un avance o una preparación real que ahorre esfuerzo."],["Reconocer lo conocido","“¿Lo de siempre?”","Una preferencia confirmada, visible y que pueda cambiarse."],["Dar una mano","“¿Lo vemos juntos?”","Una experiencia que ayude a comprender o resolver."],["Tener una atención","“Esto va por nuestra cuenta”","Algo que Pay efectivamente cubre, con un alcance claro."]])}
    <p>Estos ejemplos muestran posibilidades de expresión; no son frases obligatorias ni nuevos nombres para los ejes del gesto.</p>
    <h4>Para elegir una expresión</h4>
    ${dash(["<b>Partimos de lo que Pay hace por la persona.</b> La frase vuelve perceptible esa ayuda, preparación o atención.","<b>Usamos una familiaridad acorde con el vínculo.</b> No suponemos hábitos, emociones ni una confianza que todavía no existe.","<b>Buscamos naturalidad y comprensión.</b> La identidad argentina puede sentirse en el ritmo, el voseo y las formas de relacionarnos, sin acumular modismos.","<b>Ajustamos la expresión al momento.</b> Ante un problema, el gesto puede ser “Nos ocupamos de revisarlo”, siempre que exista esa gestión y expliquemos cómo continúa."])}
    <p>Evaluamos la frase completa y lo que el producto hace para sostenerla. Además de afirmar o celebrar, exploramos cómo expresar una preparación, una ayuda o una posibilidad nueva.</p>
    <h3>Humor</h3>
    <p>Puede aparecer como un guiño breve en descubrimiento, beneficios o celebraciones. Entender el chiste nunca es necesario para completar una tarea.</p>
    <p>En errores, reclamos, demoras, seguridad, deuda y decisiones de financiación usamos un tono cercano y directo, sin chistes. El humor nunca recae sobre la persona, sus hábitos, sus conocimientos o su situación económica.</p>
    <h3>Metáforas</h3>
    <p>Pueden invitar, reconocer o hacer visible el gesto. El apoyo explica el valor concreto y sus condiciones; el botón anticipa la acción.</p>
    <p>“Que no falte la picada” puede presentar un beneficio relacionado con compartir. “Tenemos un regalo para vos” requiere una atención real: abrirla no puede activar una compra o contratación.</p>
    <p>Las operaciones y los estados mantienen nombres explícitos, como “Ingresar dinero” o “Pago pendiente”. Una deuda nunca se presenta como un regalo.</p>`, "6.4"],
   ["ejemplos","Ejemplos para escribir y revisar", `

    <p>Los campos entre llaves se completan con información real. Si falta una condición esencial, se resuelve antes de comunicar la propuesta.</p>`, "6.5"],

 {id:"glosario", nav:"Glosario financiero", group:"Lenguaje", hero:"Glosario financiero",

    <p>Respetamos nombres oficiales, documentos de terceros y denominaciones contractuales. Explicamos los términos técnicos cuando sean necesarios.</p>`, "7.1"],
   ["conceptos","Qué conceptos distinguimos", `

 posición dentro de loyalty; los puntos, una unidad de acumulación; el beneficio, el valor al que se accede. Usamos los componentes que efectivamente tenga el programa."]])}

/* ================= Navegación ================= */
const NAV = [
 {link:"inicio"},
 {group:"Fundamentos", items:["promesa","marco","territorio","gesto"]},
 {group:"Principios", items:["principios"]},
 {group:"Lenguaje", items:["voz-y-tono","escribir","glosario"]},
];
const PAGE = Object.fromEntries(PAGES.map(p=>[p.id,p]));
const ORDER = PAGES.map(p=>p.id);
const ANCHOR_PAGE = {};
PAGES.forEach(p=>p.sections.forEach(s=>{ if(ANCHOR_PAGE[s[0]]||PAGE[s[0]]) console.warn("id duplicado",s[0]); ANCHOR_PAGE[s[0]]=p.id; }));
const groupOf = id => (NAV.find(n=>n.group && n.items.includes(id)) || {}).group;
const openGroups = new Set();
const chevron = `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 6l4 4 4-4"/></svg>`;
/* Cada capítulo lleva debajo sus secciones; solo se despliegan las del capítulo en el que estás */
const secList = id => `<div class="nav-secs" data-secs="${id}" hidden>${PAGE[id].sections.map(x=>`<a class="nav-link anchor" href="#${x[0]}" data-key="${x[0]}">↳ ${x[1]}</a>`).join("")}</div>`;
function navItem(key){ return `<a class="nav-link sub" href="#${key}" data-key="${key}" data-ch="${key}">${PAGE[key].nav}</a>${secList(key)}`; }
function renderNav(){
  side.innerHTML = NAV.map(n=>{
    if(n.link) return `<a class="nav-link" href="#${n.link}" data-key="${n.link}" data-ch="${n.link}">${PAGE[n.link].nav}</a>${secList(n.link)}`;
    const open = openGroups.has(n.group), gid = "g-"+n.group.toLowerCase();
    return `<button type="button" class="nav-group" aria-expanded="${open}" aria-controls="${gid}" data-group="${n.group}">${n.group}${chevron}</button><div class="nav-items" id="${gid}" ${open?"":"hidden"}>${n.items.map(navItem).join("")}</div>`;
  }).join("");
  side.querySelectorAll("[data-group]").forEach(b=>b.addEventListener("click",()=>{
    const g=b.dataset.group; openGroups.has(g)?openGroups.delete(g):openGroups.add(g); renderNav(); markActive(false);
    const nb=side.querySelector(`[data-group="${g}"]`); if(nb) nb.focus();
  }));
}
let currentPage=null, currentAnchor=null, openedFor=null;
function markActive(follow){
  /* al entrar a un capítulo se abre su grupo; si después lo cerrás a mano, queda cerrado */
  if(currentPage && openedFor!==currentPage){ openedFor = currentPage; const g = groupOf(currentPage); if(g && !openGroups.has(g)){ openGroups.add(g); renderNav(); } }
  side.querySelectorAll("[data-secs]").forEach(d=>{ d.hidden = d.dataset.secs!==currentPage; });
  const key = currentAnchor || currentPage;
  let on = null;
  side.querySelectorAll("[data-key]").forEach(a=>{
    const hit = a.dataset.key===key;
    if(hit){ a.setAttribute("aria-current","location"); on = a; } else a.removeAttribute("aria-current");
    a.classList.toggle("in-ch", !!a.dataset.ch && a.dataset.ch===currentPage && !!currentAnchor);
  });
  /* el índice se desplaza solo para que el punto activo siempre se vea */
  if(follow && on && !document.body.classList.contains("nav-open")){
    const sr = side.getBoundingClientRect(), r = on.getBoundingClientRect();
    if(r.top < sr.top + 8 || r.bottom > sr.bottom - 8) side.scrollTop += (r.top - sr.top) - sr.height/3;
  }
}
/* ================= Guía en una sola página ================= */
function chapterHTML(p){
  return `<div class="chapter" id="${p.id}" data-page="${p.id}">
   <div class="hero${p.id==="inicio"?"":" hero-ch"}"><h1>${p.hero}</h1></div>
   <div class="content">
    ${Array.isArray(p.intro) ? `<div class="intro">${p.intro.map(t=>`<p>${t}</p>`).join("")}</div>` : `<p class="intro">${p.intro}</p>`}
    ${p.about||""}
    ${p.afterIndex ? `<div class="page-ph" style="display:flex;flex-direction:column;gap:24px">${p.afterIndex}</div>` : ""}
    ${p.sections.map(s=>s[4] ? `<section class="sec p" id="${s[0]}"><div class="sec-head"><h2>${s[1]}</h2><p class="gest"><span class="gest-label">Gesto</span><span class="gest-text">${s[4][0].toUpperCase()+s[4].slice(1)}</span></p></div><div class="body">${s[2]}</div></section>` : `<section class="sec" id="${s[0]}"><div class="sec-head"><h2>${s[1]}</h2></div><div class="body">${s[2]}</div></section>`).join("")}
   </div></div>`;
}
function renderAll(){
  main.innerHTML = PAGES.map(chapterHTML).join("");
  wireGlossary();
}
const headerH = () => document.querySelector(".header").getBoundingClientRect().bottom;
/* Qué capítulo y qué sección se está leyendo: lo último que pasó por debajo del header */
let pinned = null;
function spy(){
  let page = "inicio", anchor = null;
  if(pinned){ page = ANCHOR_PAGE[pinned] || pinned; anchor = PAGE[pinned] ? null : pinned; }
  else {
    const line = headerH() + Math.min(160, innerHeight*0.25);
    const atEnd = innerHeight + scrollY >= document.documentElement.scrollHeight - 2;
    for(const ch of main.querySelectorAll(".chapter")){ if(ch.getBoundingClientRect().top <= line) page = ch.dataset.page; else break; }
    const secs = [...document.getElementById(page).querySelectorAll(".sec:not([hidden])")];
    for(const sc of secs){ if(sc.getBoundingClientRect().top <= line) anchor = sc.id; else break; }
    if(atEnd && page===ORDER[ORDER.length-1] && secs.length) anchor = secs[secs.length-1].id;
  }
  if(page===currentPage && anchor===currentAnchor) return;
  currentPage = page; currentAnchor = anchor;
  markActive(true);
  document.title = (page==="inicio" ? "" : PAGE[page].nav+" · ") + "Guía de experiencia Pay";
  const h = "#"+(anchor||page);
  if(location.hash !== h && !(page==="inicio" && !anchor && !location.hash)) history.replaceState(null, "", h);
}
let ticking = false;
const unpin = () => { pinned = null; spy(); };
window.addEventListener("scroll",()=>{ if(pinned){ clearTimeout(goTo.t); goTo.t = setTimeout(unpin, 200); } if(!ticking){ ticking = true; requestAnimationFrame(()=>{ ticking = false; spy(); }); } }, {passive:true});
window.addEventListener("resize",()=>spy());
/* Mientras la página se desplaza hacia un destino elegido, el índice muestra ese destino; cualquier gesto propio lo libera */
let userMoved = false;
["wheel","touchstart","keydown","mousedown"].forEach(ev=>window.addEventListener(ev,e=>{ userMoved = true; if(pinned && !(ev==="mousedown" && e.target.closest("a[href^='#']"))){ pinned = null; spy(); } }, {passive:true}));
function goTo(id, smooth){
  const el = id && document.getElementById(id);
  closeNav(); closeSearch();
  if(!el){ pinned = null; window.scrollTo({top:0, behavior: smooth?"smooth":"auto"}); spy(); return; }
  pinned = id; spy();
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  el.scrollIntoView({behavior: smooth && !reduce ? "smooth" : "auto", block:"start"});
  /* se libera cuando el desplazamiento termina (o enseguida si no hubo que moverse) */
  clearTimeout(goTo.t); goTo.t = setTimeout(unpin, 300);
}
function route(){ const h = decodeURIComponent(location.hash.slice(1)); goTo(PAGE[h]||ANCHOR_PAGE[h] ? h : null, false); }
document.addEventListener("click",e=>{
  const a=e.target.closest('a[href^="#"]'); if(!a || e.metaKey || e.ctrlKey || e.shiftKey) return;
  const id = decodeURIComponent(a.getAttribute("href").slice(1));
  if(!(PAGE[id]||ANCHOR_PAGE[id])) return;
  e.preventDefault();
  if(location.hash !== "#"+id) history.pushState(null, "", "#"+id);
  goTo(id, true);
});
/* ================= Checklist ================= */
const store = {
  get(k,d){ try{ const v=localStorage.getItem("payguia2:"+k); return v===null?d:JSON.parse(v); }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem("payguia2:"+k, JSON.stringify(v)); }catch(e){} }
};
let role = store.get("rol","producto");
function wireChecklist(){
  const draw = ()=>{
    main.querySelectorAll("[data-role]").forEach(b=>b.setAttribute("aria-pressed", b.dataset.role===role));
    main.querySelectorAll("[data-checks]").forEach(ul=>{
      const p = PRINCIPLES.find(x=>x.id===ul.dataset.checks);
      ul.innerHTML = p.roles[role].map((q,i)=>{ const id=`c-${role}-${p.id}-${i}`; return `<li><label><input type="checkbox" id="${id}" ${store.get(id,false)?"checked":""}>${q}</label></li>`; }).join("");
    });
    count();
  };
  const count = ()=>{ const all=main.querySelectorAll("[data-checks] input"), done=main.querySelectorAll("[data-checks] input:checked"); document.getElementById("count").textContent = `${done.length} de ${all.length} revisadas`; };
  main.querySelectorAll("[data-role]").forEach(b=>b.addEventListener("click",()=>{ role=b.dataset.role; store.set("rol",role); draw(); }));
  main.addEventListener("change",e=>{ if(e.target.matches("[data-checks] input")){ store.set(e.target.id, e.target.checked); count(); } });
  document.getElementById("reset").addEventListener("click",()=>{ main.querySelectorAll("[data-checks] input").forEach(c=>store.set(c.id,false)); draw(); });
  draw();
}

/* ================= Glosario ================= */
const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
function wireGlossary(){
  const input = document.getElementById("gq");
  input.addEventListener("input",()=>{
    const v = norm(input.value.trim());
    document.getElementById("glosario").querySelectorAll(".sec").forEach(sec=>{
      let any=false;
      sec.querySelectorAll("tbody tr").forEach(tr=>{ const m=!v||norm(tr.textContent).includes(v); tr.hidden=!m; if(m) any=true; });
      sec.hidden = !any;
    });
  });
}

/* ================= Buscador ================= */
const tmp = document.createElement("div");
const INDEX = [];
PAGES.forEach(p=>{
  INDEX.push({key:p.id, title:p.nav, where:"Página", text:p.hero+" "+[].concat(p.intro).join(" ")});
  p.sections.forEach(s=>{ tmp.innerHTML=s[2]; INDEX.push({key:s[0], title:s[1], where:p.nav, text:s[1]+" "+tmp.textContent.replace(/\s+/g," ")}); });
});
const search=document.getElementById("search"), q=document.getElementById("q"), results=document.getElementById("results"), searchBtn=document.getElementById("searchBtn");
function openSearch(){ search.hidden=false; searchBtn.setAttribute("aria-expanded","true"); q.focus(); }
function closeSearch(){ if(search.hidden) return; search.hidden=true; searchBtn.setAttribute("aria-expanded","false"); }
searchBtn.addEventListener("click",()=> search.hidden ? openSearch() : closeSearch());
q.addEventListener("input",()=>{
  const v=norm(q.value.trim());
  if(v.length<2){ results.innerHTML=""; return; }
  const hits = INDEX.map(e=>{ const t=norm(e.text), i=t.indexOf(v); return i<0?null:{...e, i, rank:norm(e.title).includes(v)?0:1}; }).filter(Boolean).sort((a,b)=>a.rank-b.rank).slice(0,10);
  results.innerHTML = hits.length ? hits.map(h=>{ const s=Math.max(0,h.i-40); return `<li><a href="#${h.key}">${esc(h.title)}<small>${esc(h.where)} · …${esc(h.text.slice(s,h.i+60))}…</small></a></li>`; }).join("") : `<li class="small" style="padding:10px 8px">Sin resultados para “${esc(q.value)}”.</li>`;
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ closeSearch(); closeNav(); } });
document.addEventListener("click",e=>{ if(!search.hidden && !e.target.closest("#search") && !e.target.closest("#searchBtn")) closeSearch(); });

/* ================= Menú en celular ================= */
const menuBtn=document.getElementById("menuBtn"), scrim=document.getElementById("scrim");
function closeNav(){ document.body.classList.remove("nav-open"); menuBtn.setAttribute("aria-expanded","false"); scrim.hidden=true; }
menuBtn.addEventListener("click",()=>{ const o=document.body.classList.toggle("nav-open"); menuBtn.setAttribute("aria-expanded",o); scrim.hidden=!o; });
scrim.addEventListener("click",closeNav);

const side=document.getElementById("side"), main=document.getElementById("main");
renderNav();
renderAll();
window.addEventListener("hashchange",route);
window.addEventListener("popstate",route);
route();
/* al terminar de cargar las fuentes el largo cambia: se vuelve a ubicar el destino del link */
if(document.fonts && location.hash) document.fonts.ready.then(()=>{ if(!userMoved) route(); });
</script>
